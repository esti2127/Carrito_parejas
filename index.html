<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/main.css">
  <title>Carrito de la compra</title>
</head>
<body>

  <form id="formCarrito">

    <select id="tipoProducto" name="tipoProducto">
        <option value="" disabled selected>Selecciona una opción</option>

        <optgroup label="Material escolar">
          <option value="Mochila">Mochila</option>
          <option value="Borragoma">Borragoma</option>
          <option value="Lapicero">Lapicero</option>
          <option value="Bolígrafo">Bolígrafo</option>
        </optgroup>

        <optgroup label="Material deportivo">
          <option value="Bicicleta">Bicicleta</option>
          <option value="Mallas">Mallas</option>
          <option value="Balón">Balón</option>
        </optgroup>

        <optgroup label="Material de cocina">
          <option value="Sartén">Sartén</option>
          <option value="Espumadera">Espumadera</option>
          <option value="Olla">Olla</option>
        </optgroup>

      </select><br><br>

      <button id="botonAniadir" type="submit">Añadir</button>
      <button id="botonQuitar" type="submit">Quitar</button>

    
    
  </form>

  <table id="tablaProductos">
    <thead>
      <tr>
        <th>Producto</th>
        <th>Cantidad</th>
        <th>Quitar uno</th>
      </tr>
    </thead>
    <tbody>
      <!-- Aquí va a ir cada fila de producto -->
    </tbody>
  </table>

  <script src="js/main.js"></script>

</body>
</html>
